name: 功能 / 任务
description: 一个可交付的功能点或工程任务（程序、美术、音频、测试）
title: "[任务] "
labels: ["task"]
body:
  - type: dropdown
    id: track
    attributes:
      label: 工作线
      options:
        - 程序（系统 / 规则 / UI）
        - 美术（场景 / 角色 / UI 素材）
        - 音频（BGM / 音效）
        - 策划（规格细化 / 数值标定）
        - 测试 / 工程
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标与验收标准
      description: 完成时"什么算做完"，尽量可验证
      placeholder: |
        目标：实现流言传播（消息传歪）的传播意愿判定
        验收：信任 ≥60 愿传 / 40–60 五五开 / <40 不传，并有单测覆盖三个分支
    validations:
      required: true

  - type: input
    id: spec
    attributes:
      label: 规格依据
      description: 对应主文档的章节（如 §10 流言、§7.2）
      placeholder: "docs/gdd/core-gameplay-v3.1.md §10 流言"
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: 里程碑
      options:
        - M1 核心循环（v3.0 第一版）
        - M2 深度扩展（v3.0 第二版）
        - M3 打磨与提交（v3.0 第三版）
        - 未定
    validations:
      required: true

  - type: textarea
    id: deps
    attributes:
      label: 依赖与风险
      description: 依赖的其他任务、可能触碰的设计铁律、需要的数据表
    validations:
      required: false

  - type: checkboxes
    id: dod
    attributes:
      label: 完成定义（DoD）
      options:
        - label: 相关 `docs/` 已更新，`CHANGELOG.md` 已记录
          required: false
        - label: 数值进入 `data/`，无魔法数字
          required: false
        - label: 未引入角色名 / ID 判断
          required: false
