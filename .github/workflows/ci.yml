name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: 仓库结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 必需文件与目录
        run: |
          missing=0
          for f in project.godot README.md CHANGELOG.md CONTRIBUTING.md LICENSE AGENTS.md .gitignore .editorconfig .gitattributes; do
            [ -f "$f" ] || { echo "::error file=$f::缺少必需文件 $f"; missing=1; }
          done
          for d in assets autoload data docs scenes scripts tests shaders .github; do
            [ -d "$d" ] || { echo "::error::缺少必需目录 $d"; missing=1; }
          done
          exit $missing

      - name: 不得被版本控制的文件
        run: |
          bad=0
          while IFS= read -r f; do
            case "$f" in
              .godot/*|android/*|build/*|dist/*|export/*|.reasonix/*|reasonix.toml|*'~$'*|*.log|*.tmp)
                echo "::error file=$f::该文件不应被提交（见 .gitignore）"; bad=1 ;;
            esac
          done < <(git ls-files)
          exit $bad

      - name: 文档相对链接检查
        run: python3 .github/scripts/check_docs_links.py

  gdscript:
    name: GDScript 格式与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 gdtoolkit
        run: pip install 'gdtoolkit==4.*'
      - name: gdformat --check（不符合格式即失败）
        run: |
          if ! gdformat --check scripts/; then
            echo "::error title=格式::存在未按 gdformat 格式化的脚本，差异如下（本地跑 gdformat scripts/ 即可自动修正）"
            gdformat --diff scripts/ || true
            exit 1
          fi
      - name: gdlint（静态检查有问题即失败）
        run: gdlint scripts/

  offline-gates:
    name: 离线六道门 + 铁律测试 + 对拍自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 一键跑离线测试（六道门 + 铁律 + 对拍）
        run: |
          export PYTHONIOENCODING=utf-8
          bash tools/run_tests.sh --no-godot
